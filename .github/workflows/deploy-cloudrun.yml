name: Deploy Cloud Run

on:
  push:
    branches: [Dev, main]
    paths:
      # не 'main.py': с #36 код живёт ещё и в domain.py / llm_prompt.py, и
      # правка в них обязана запускать деплой — иначе прод молча остаётся
      # на старом коде при зелёном PR
      - '**.py'
      - '!tests/**'          # правки тестов деплой не меняют
      - 'requirements.txt'
      - '.gitignore'         # по нему gcloud решает, что уходит в образ
      - '.github/workflows/deploy-cloudrun.yml'
  workflow_dispatch:  # ручной запуск из UI на случай если нужно передеплоить без изменений

permissions:
  contents: read
  id-token: write   # для Workload Identity Federation

jobs:
  # Деплой ждёт тестов: с красным pytest код не уходит ни на dev, ни на прод.
  # Google-модули тесты подменяют заглушками (tests/conftest.py), но ставим
  # весь requirements.txt — заодно CI заметит пин, который не ставится.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # токен GCP тестам не нужен
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # как рантайм Cloud Run (DEPLOY.md)
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt "pytest==8.*"

      - name: Run tests
        run: python -m pytest -o addopts="" -rs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: env
        name: Resolve target environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service=runs-api"                          >> $GITHUB_OUTPUT
            echo "bucket=running-tracker-aabramov77"         >> $GITHUB_OUTPUT
            echo "env=prod"                                  >> $GITHUB_OUTPUT
          else
            echo "service=runs-api-dev"                      >> $GITHUB_OUTPUT
            echo "bucket=running-tracker-aabramov77-dev"     >> $GITHUB_OUTPUT
            echo "env=dev"                                   >> $GITHUB_OUTPUT
          fi

      - id: auth
        name: Auth to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PATH }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ steps.env.outputs.service }}" \
            --source=. \
            --function=runs_api \
            --region=europe-west1 \
            --allow-unauthenticated \
            --set-env-vars="BUCKET_NAME=${{ steps.env.outputs.bucket }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.service }}" \
            --region=europe-west1 \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "🚀 ${{ steps.env.outputs.env }} deployed: $URL"
          echo "$URL" >> $GITHUB_STEP_SUMMARY

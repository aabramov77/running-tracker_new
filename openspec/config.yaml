schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: веб-трекер беговых тренировок (running-tracker).
  Стек: фронтенд — статические index.html / app.js / style.css без сборщика;
  бэкенд — Python Cloud Run Function (main.py, api.py, storage.py), тесты pytest.
  Данные — в GCS bucket running-tracker-aabramov77.
  Хранилище только append-only: без физического удаления и перезаписи,
  каждая правка — новая версия, удаление — логическое (подробно в CLAUDE.md).
  Фичи ведутся GitHub Issues в aabramov77/running-tracker_new; изменения
  идут через ветку Dev, в main — только merge из Dev.

